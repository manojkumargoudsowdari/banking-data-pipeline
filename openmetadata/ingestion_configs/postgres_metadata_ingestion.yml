# Phase 9B template only. Do not execute this file in Phase 9B.
# Review against the approved OpenMetadata version before future use.
# Purpose: catalog the existing PostgreSQL banking source database.
# Credential policy: environment variables only; no credentials are stored here.

source:
  type: postgres
  serviceName: banking_postgres
  serviceConnection:
    config:
      type: Postgres
      scheme: postgresql+psycopg2
      hostPort: "${POSTGRES_HOST}:${POSTGRES_PORT}"
      username: "${POSTGRES_USER}"
      authType:
        password: "${POSTGRES_PASSWORD}"
      database: "${POSTGRES_DB}"
      schemaFilterPattern:
        includes:
          - "^public$"
  sourceConfig:
    config:
      type: DatabaseMetadata
      includeTables: true
      includeViews: false
      markDeletedTables: false
      tableFilterPattern:
        includes:
          - "^(branches|products|reference_codes|customers|accounts|transactions|customer_risk_scores|data_quality_rules|stewardship_issues|source_to_target_mappings)$"

sink:
  type: metadata-rest
  config: {}

workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: "${OPENMETADATA_HOST_PORT}"
    authProvider: openmetadata
    securityConfig:
      jwtToken: "${OPENMETADATA_JWT_TOKEN}"
    storeServiceConnection: false
