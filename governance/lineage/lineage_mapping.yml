    source_field: public.customers.customer_id
    raw_field: raw.customers.customer_id
    standardized_field: standardized.customers.customer_id
    curated_field: dim_customer.customer_id
    transformation: Type normalization followed by direct selection
    validation_categories:
      - null_check
      - duplicate_key_check
      - referential_integrity_check
      - source_to_target_reconciliation

  - business_field: account_id
    source_field: public.accounts.account_id
    raw_field: raw.accounts.account_id
    standardized_field: standardized.accounts.account_id
