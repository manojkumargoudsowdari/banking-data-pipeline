version: 1
lineage_name: Banking Pipeline Manual Lineage
lineage_status: manual_documentation

stage_flow:
  - sequence: 1
    stage: PostgreSQL source
    asset_pattern: "public.<table>"
  - sequence: 2
    stage: Raw Parquet
    asset_pattern: "data/raw/<table>/load_date=<YYYY-MM-DD>/<table>.parquet"
  - sequence: 3
    stage: Standardized Parquet
    asset_pattern: "data/standardized/<table>/load_date=<YYYY-MM-DD>/<table>.parquet"
  - sequence: 4
    stage: Curated model
    asset_pattern: "data/curated/<model>/load_date=<YYYY-MM-DD>/<model>.parquet"
  - sequence: 5
    stage: SQL DQ results
    asset_pattern: "data/dq_results/sql/load_date=<YYYY-MM-DD>/<check>_results.csv"
  - sequence: 6
    stage: PySpark DQ results
    asset_pattern: "data/dq_results/pyspark/load_date=<YYYY-MM-DD>/"

validation_dependency_note: SQL DQ and PySpark DQ are independent validation consumers of standardized and curated assets. Their sequence here represents the project phase flow, not a data dependency from SQL results into PySpark results.

dataset_lineage:
  - lineage_id: LIN_CUSTOMER
    source_assets:
      - public.customers
    raw_assets:
      - raw.customers
    standardized_assets:
      - standardized.customers
    curated_assets:
      - dim_customer
    sql_dq_assets:
      - null_check_results
      - duplicate_check_results
      - source_target_reconciliation_results
    pyspark_dq_assets:
      - dataset_profile_results
      - column_profile_results
      - rule_results
      - business_rule_results
      - exception_records

  - lineage_id: LIN_ACCOUNT
    source_assets:
      - public.accounts
    raw_assets:
      - raw.accounts
    standardized_assets:
      - standardized.accounts
    curated_assets:
      - dim_account
      - fact_daily_account_balance
    sql_dq_assets:
      - accepted_values_check_results
      - source_target_reconciliation_results
      - control_total_results
    pyspark_dq_assets:
      - dataset_profile_results
      - rule_results
      - business_rule_results
      - exception_records

  - lineage_id: LIN_TRANSACTION
    source_assets:
      - public.transactions
      - public.accounts
    raw_assets:
      - raw.transactions
      - raw.accounts
    standardized_assets:
      - standardized.transactions
      - standardized.accounts
    curated_assets:
      - fact_transaction
    sql_dq_assets:
      - referential_integrity_check_results
      - source_target_reconciliation_results
      - control_total_results
      - exception_records
    pyspark_dq_assets:
      - dataset_profile_results
      - rule_results
      - business_rule_results
      - exception_records

  - lineage_id: LIN_RISK
    source_assets:
      - public.customer_risk_scores
    raw_assets:
      - raw.customer_risk_scores
    standardized_assets:
      - standardized.customer_risk_scores
    curated_assets:
      - fact_customer_risk_score
    sql_dq_assets:
      - accepted_values_check_results
      - referential_integrity_check_results
      - source_target_reconciliation_results
    pyspark_dq_assets:
      - dataset_profile_results
      - rule_results
      - business_rule_results
      - exception_records

field_lineage_examples:
