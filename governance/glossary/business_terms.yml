version: 1
glossary_name: Banking Data Governance Glossary
terms:
  - name: Customer
    definition: A person or organization that has or may establish a banking relationship.
    domain: Customer
    owner: Customer Data Owner
    steward: Customer Data Steward

  - name: Account
    definition: A banking arrangement used to hold, access, borrow, or transfer funds for a customer.
    domain: Account
    owner: Deposit Products Owner
    steward: Account Data Steward

  - name: Branch
    definition: A physical or operational banking location responsible for serving customers and accounts.
    domain: Branch
    owner: Branch Operations Owner
    steward: Branch Data Steward

  - name: Product
    definition: A defined banking offering with associated type, terms, pricing, and lifecycle status.
    domain: Product
    owner: Product Management Owner
    steward: Product Data Steward

  - name: Transaction
    definition: A recorded financial event that changes or represents activity on a banking account.
    domain: Transaction
    owner: Payments Operations Owner
    steward: Transaction Data Steward

  - name: Transaction Amount
    definition: The positive monetary value associated with a transaction, expressed in its recorded currency.
    domain: Transaction
    owner: Payments Operations Owner
    steward: Transaction Data Steward

  - name: Transaction Date
    definition: The date and time at which a transaction occurred in the source banking system.
    domain: Transaction
    owner: Payments Operations Owner
    steward: Transaction Data Steward

  - name: Transaction Type
    definition: The controlled classification of transaction activity, such as deposit, withdrawal, transfer, payment, fee, or interest.
    domain: Transaction
    owner: Payments Operations Owner
    steward: Transaction Data Steward

  - name: Account Balance
    definition: The monetary amount recorded for an account at a stated point or reporting date.
    domain: Account
    owner: Deposit Products Owner
    steward: Account Data Steward

  - name: Customer Risk Score
    definition: A numeric assessment of customer risk generated by an identified scoring model and version.
    domain: Risk
    owner: Enterprise Risk Owner
    steward: Risk Data Steward

  - name: Risk Band
    definition: A controlled categorical grouping derived from a customer risk score.
    domain: Risk
    owner: Enterprise Risk Owner
    steward: Risk Data Steward

  - name: Critical Data Element
    definition: A data element whose quality, protection, or consistent interpretation is material to business, risk, regulatory, or operational outcomes.
    domain: Data Quality
    owner: Data Governance Council
    steward: Data Governance Steward
